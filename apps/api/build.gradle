plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.churchnominations'
version = '0.1.0-SNAPSHOT'
description = 'REST API for the Church Nominations application'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext['jackson-bom.version'] = '3.1.7'
ext['logback.version'] = '1.6.5'
ext['tomcat.version'] = '11.0.27'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('devBootRun', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Runs the API locally with database-backed development authentication.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.churchnominations.api.ChurchNominationsApiApplication'
    systemProperty 'spring.profiles.active', 'dev'
}