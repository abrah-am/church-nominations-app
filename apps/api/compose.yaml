services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${APP_DATABASE_NAME:-church_nominations}
      POSTGRES_USER: ${APP_DATABASE_USERNAME:?Set APP_DATABASE_USERNAME in apps/api/.env}
      POSTGRES_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in apps/api/.env}
    ports:
      - "127.0.0.1:${APP_DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
