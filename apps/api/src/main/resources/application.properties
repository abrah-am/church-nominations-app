app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.datasource.url=${APP_DATABASE_URL:jdbc:postgresql://localhost:5433/church_nominations}
spring.datasource.username=${APP_DATABASE_USERNAME}
