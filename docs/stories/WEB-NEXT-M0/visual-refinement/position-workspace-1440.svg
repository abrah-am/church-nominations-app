<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
  <title id="title">Refined Church Nominations position workspace, desktop 1440 by 1280</title>
  <desc id="desc">Illustrative static current-term position workspace. A full-label application sidebar contains Elections and Settings destinations only. The content header alone contains Church, Term, Department and Position selectors. The workspace shows the illustrative closed Round 1 source results, decisions, separate elected-candidate response, poll history and a distinct active Round 2 participant session.</desc>
